name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analytics/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: python -m pip install -r analytics/requirements.txt
      - run: python -m unittest discover -s analytics -p 'test_*.py'
      - run: node --check viewer.js
